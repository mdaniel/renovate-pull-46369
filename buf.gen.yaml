version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/bufbuild/buf-examples/gen
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.6
    out: gen
    opt: paths=source_relative
  - remote: buf.build/grpc-ecosystem/gateway:v2.30.0
    # a valid-looking label but does not exist
    out: api/proto/gen/go
    opt:
      # Do not generate unbound methods to force annotations
      - generate_unbound_methods=false
      - logtostderr=true
      - paths=source_relative
  - remote: buf.build/grpc/go:v1
    # malformed, leaves it intact since there is not v2
    out: api/proto/gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/gosimple
    # versionless, will skip
    out: gen
    opt:
      - paths=source_relative
      - simple
